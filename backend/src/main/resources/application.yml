server:
  port: 8080

spring:
  application:
    name: functional-supervision-platform
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  database:
    path: ${PLATFORM_DB_PATH:}
  storage:
    three-fixed-path: ${THREE_FIXED_STORAGE_PATH:backend/storage/three-fixed}
    evaluation-archives-path: ${EVALUATION_ARCHIVE_STORAGE_PATH:backend/storage/evaluation-archives}
    internal-evaluation-path: ${INTERNAL_EVALUATION_STORAGE_PATH:backend/storage/internal-evaluation}
    org-performance-path: ${ORG_PERFORMANCE_STORAGE_PATH:backend/storage/org-performance}
    public-evaluation-path: ${PUBLIC_EVALUATION_STORAGE_PATH:backend/storage/public-evaluation}
    self-evaluation-path: ${SELF_EVALUATION_STORAGE_PATH:backend/storage/self-evaluation}
  security:
    mock-current-username: ${MOCK_CURRENT_USERNAME:zhang.zhuren}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
